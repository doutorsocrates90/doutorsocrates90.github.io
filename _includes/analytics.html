{%- assign a = site.analytics -%}
{%- if a.provider != "" and a.id != "" -%}
  {%- if a.provider == "goatcounter" -%}
<script data-goatcounter="https://{{ a.id }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  {%- elsif a.provider == "plausible" -%}
<script defer data-domain="{{ a.id }}" src="https://plausible.io/js/script.js"></script>
  {%- elsif a.provider == "ga4" -%}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ a.id }}"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','{{ a.id }}');</script>
  {%- endif -%}
<script>
document.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('[data-cta]'); if(!el) return;
  var n=el.getAttribute('data-cta');
  try{
    if(window.goatcounter&&window.goatcounter.count) window.goatcounter.count({path:'cta-'+n,title:'CTA '+n,event:true});
    if(window.plausible) window.plausible('CTA',{props:{name:n}});
    if(window.gtag) gtag('event','cta_click',{cta_name:n});
  }catch(_){}
});
</script>
{%- endif -%}
